<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrics Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #e6edf3; --muted: #8b949e; --ok: #3fb950; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 999px; font-size: 13px; margin-bottom: 24px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.up { background: var(--ok); } .dot.down { background: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .value { font-size: 26px; margin: 8px 0 10px; }
  .value small { font-size: 13px; color: var(--muted); }
  .bar { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .meta { margin-top: 24px; font-size: 12px; color: var(--muted); }
  .meta code { color: var(--accent); }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; overflow-x: auto; font-size: 12px; color: var(--muted); margin-top: 12px;
  }
  button {
    background: transparent; color: var(--accent); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Metrics Dashboard</h1>
  <p class="sub">NGINX dashboard &rarr; metrics collector, over the Docker network.</p>

  <div class="pill">
    <span class="dot" id="dot"></span>
    <span id="health">checking collector…</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">CPU load (1m)</div>
      <div class="value" id="cpu">–</div>
      <div class="bar"><span id="cpu-bar"></span></div>
    </div>
    <div class="card">
      <div class="label">Memory used</div>
      <div class="value" id="mem">–</div>
      <div class="bar"><span id="mem-bar"></span></div>
    </div>
    <div class="card">
      <div class="label">Disk used</div>
      <div class="value" id="disk">–</div>
      <div class="bar"><span id="disk-bar"></span></div>
    </div>
    <div class="card">
      <div class="label">Samples on volume</div>
      <div class="value" id="samples">–</div>
      <div class="bar"><span id="samples-bar" style="width:100%"></span></div>
    </div>
  </div>

  <p class="meta">
    Collector reached at <code>http://collector:6000</code>, proxied as <code id="apibase">/api/</code>.
    Last update: <span id="ts">never</span> &middot; <button id="refresh">Refresh now</button>
  </p>
  <pre id="raw">waiting for first sample…</pre>
</div>

<script>
  const $ = id => document.getElementById(id);

  // Resolve /api relative to wherever this page is served from, NOT from the
  // domain root. A root-absolute fetch('/api/status') breaks the moment the
  // dashboard sits behind a path-prefix reverse proxy (e.g. the Poridhi lab
  // serves it at /proxy/9090/, so /api/status hits the proxy root and 404s).
  function apiBase() {
    let path = window.location.pathname;
    if (!path.endsWith('/')) {
      // Trailing segment with a dot is a file name (/index.html) -> drop it.
      // Otherwise it is a directory reached without its slash -> add one.
      path = /\/[^/]*\.[^/]*$/.test(path) ? path.replace(/[^/]*$/, '') : path + '/';
    }
    return path + 'api/';
  }

  const API = apiBase();

  function setBar(el, percent) { el.style.width = Math.min(100, Math.max(0, percent)) + '%'; }

  async function tick() {
    try {
      const [status, metrics] = await Promise.all([
        fetch(API + 'status').then(r => r.json()),
        fetch(API + 'metrics').then(r => r.json())
      ]);

      $('dot').className = 'dot up';
      $('health').textContent =
        `collector ${status.status} on port ${status.port} (${status.host}), up ${status.uptime_seconds}s`;

      $('cpu').innerHTML = metrics.cpu_load['1m'].toFixed(2) + ' <small>load avg</small>';
      setBar($('cpu-bar'), metrics.cpu_load['1m'] * 25);

      $('mem').innerHTML = metrics.memory.used_percent + '% <small>of ' + metrics.memory.total_mb + ' MB</small>';
      setBar($('mem-bar'), metrics.memory.used_percent);

      $('disk').innerHTML = metrics.disk.used_percent + '% <small>of ' + metrics.disk.total_gb + ' GB</small>';
      setBar($('disk-bar'), metrics.disk.used_percent);

      $('samples').innerHTML = status.samples_stored + ' <small>persisted</small>';

      $('ts').textContent = metrics.collected_at;
      $('raw').textContent = JSON.stringify(metrics, null, 2);
    } catch (err) {
      $('dot').className = 'dot down';
      $('health').textContent = 'collector unreachable — check `docker compose logs collector`';
      $('raw').textContent = String(err);
    }
  }

  $('apibase').textContent = API;
  $('refresh').addEventListener('click', tick);
  tick();
  setInterval(tick, 5000);
</script>
</body>
</html>
