server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Resolving the collector at request time
    # (via the $collector variable below) instead of at config-load time means
    # NGINX still starts if the collector container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Dashboard -> collector, by service name on the Docker network.
    # No hard-coded container IP anywhere.
    location /api/ {
        set $collector http://collector:6000;

        # With a variable in proxy_pass, NGINX does NOT strip the location
        # prefix automatically, so /api/status would arrive as "/". Rewrite
        # first, then proxy_pass with no URI part so the rewritten path is used.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $collector;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /healthz {
        access_log off;
        return 200 "dashboard ok\n";
        add_header Content-Type text/plain;
    }
}
